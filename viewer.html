<!doctype html><html><body style="margin:0;background:#888"><canvas id="c" width="900" height="500"></canvas>
<script type="module">
import * as THREE from 'three'
import { loadCarModel, CAR_MODELS, WHEEL_NAMES } from '/src/game/models.ts'
import { buildWheel } from '/src/game/wheel.ts'
const params = new URLSearchParams(location.search)
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true })
renderer.outputColorSpace = THREE.SRGBColorSpace
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9a9a9a)
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2))
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 6, 4); scene.add(sun)
scene.add(new THREE.GridHelper(6, 12))
let target = new THREE.Vector3(0,0.5,0)
if (params.get('m') === 'wheel') {
  const w = buildWheel(0.34, 0.26, 1); w.position.y = 0.34; w.rotation.z = 0.4; scene.add(w); target = new THREE.Vector3(0,0.34,0)
} else {
  const model = await loadCarModel(CAR_MODELS[params.get('m') || 'car29'])
  for (const name of WHEEL_NAMES) { const p = model.getObjectByName(name); if (p) { const w = buildWheel(p.userData.radius, p.userData.width, p.userData.side); p.add(w); if (name.includes('_f_')) p.rotation.y = 0.4; w.rotation.z = 0.7 } }
  scene.add(model)
}
const cam = new THREE.PerspectiveCamera(40, 900/500, 0.1, 100)
const views = [[0,1.2,6],[6,1.5,0],[4,3,4],[1.2,0.6,1.6]]
const i = parseInt(params.get('v') || '0'); cam.position.set(...views[i]); cam.lookAt(target)
renderer.render(scene, cam)
document.title = 'ready'
</script></body></html>
